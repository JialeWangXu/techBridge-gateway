name: CI goa-gateway
on:
  push:
    branches:
      - develop
      - release-*

jobs:
  ci:
    name: Tests & CodeQL
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Unit Test
        run: mvn -B verify
